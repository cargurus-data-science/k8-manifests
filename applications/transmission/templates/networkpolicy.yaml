{{- /*
Default-deny ingress, with an explicit allow from trusted namespaces on the
service port. Egress is intentionally unrestricted: pods reach Recall (Aurora),
Bedrock via the LiteLLM gateway, AWS APIs, and the OTel collector — locking
egress down belongs to a later, dedicated PR, not the chart bootstrap.

NOTE: enforcement requires a NetworkPolicy-capable CNI. The cluster uses the
default VPC CNI (DS-2795), which does NOT enforce NetworkPolicy unless the
network-policy feature is enabled. This object is therefore declarative intent
that becomes load-bearing when enforcement is turned on — it never *loosens*
anything, so it's safe to ship now.
*/ -}}
{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "transmission.name" . }}
  namespace: {{ include "transmission.namespace" . }}
  labels:
    {{- include "transmission.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "transmission.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- /* ALB (target-type=ip) dials pod IPs from VPC subnets, not from an
               allowed namespace — so any Ingress-fronted service needs its
               subnet CIDR here. */}}
        {{- range .Values.networkPolicy.allowFromCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
        {{- /* Extra listen ports get the same allow, or enabling enforcement would
               silently cut traffic to a port we deliberately publish. Empty
               default → renders nothing. */}}
        {{- range .Values.service.extraPorts }}
        - protocol: TCP
          port: {{ .port }}
        {{- end }}
{{- end }}
