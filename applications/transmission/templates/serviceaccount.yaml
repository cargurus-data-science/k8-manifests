{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "transmission.serviceAccountName" . }}
  namespace: {{ include "transmission.namespace" . }}
  labels:
    {{- include "transmission.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # NO eks.amazonaws.com/role-arn annotation — the cluster runs EKS Pod Identity
  # (DS-2795, enable_irsa=false, no OIDC). The SA→IAM binding is created
  # control-plane-side by aws_eks_pod_identity_association keyed on
  # (namespace, service_account). This SA's only job is to exist with the name
  # + namespace DS-2795 associated. See chart/README.md "Pod Identity wiring".
{{- end }}
