# reconcile-orphans (#273/#297 R2) — the periodic orphaned-run sweep CronJob.
#
# A SCHEDULED BATCH job, not a service. Layered over chart/values.yaml by:
#
#   helm upgrade --install reconcile-orphans chart/ \
#     --namespace transmission \
#     --values chart/values/reconcile-orphans-dev.yaml \
#     --set image.tag=<sha> --wait --atomic
#
# Release name = service name = values stem = `reconcile-orphans` — the
# convention deploy.yml's matrix follows (deploy-convention-release-name-trap).
#
# `cronjob.enabled: true` flips the chart to render a `batch/v1` CronJob and
# SUPPRESS the Deployment + Service (deployment.yaml / service.yaml gate on it).
# It runs the SAME mesh image (so `mesh.flow.reconcile` + scripts/ are present)
# but as a one-shot batch container that runs the sweep and exits.
#
# Why this CronJob AND the mesh startup sweep: startup catches the deploy-roll
# case (a new pod sweeps the old pod's orphans on boot); this cron catches the
# BETWEEN-deploys case — a crash / OOM / eviction with no roll behind it, where
# nothing else would ever finalize the stuck `running` row.
service:
  # Resource handle (CronJob/SA/ConfigMap name). NOT a listen port — a job has no
  # inbound traffic; `port` is unused here but the schema requires service.name.
  name: reconcile-orphans

# Reuse the mesh image: it already carries the shared `mesh` library + scripts/
# (Dockerfile builds from repo root), so scripts/reconcile_orphans.py resolves
# and `mesh.flow.reconcile` imports. CI pins the real SHA via --set image.tag.
image:
  repository: 457497801237.dkr.ecr.us-east-1.amazonaws.com/transmission/mesh
  tag: 5e172d9b
  pullPolicy: IfNotPresent

# ─────────────────────────────────────────────────────────────────────────────
# The cron itself — every 15 min. Orphans aren't urgent (a stuck row is a
# cosmetic UI lie, not a hazard) and the sweep is conservative + idempotent, so a
# generous cadence is right. Forbid overlap; a failed pass becomes a Failed Job
# (alertable) and the next tick retries (the stuck rows are untouched on failure).
# restartPolicy=Never + backoffLimit=1: don't hammer in place.
# ─────────────────────────────────────────────────────────────────────────────
cronjob:
  enabled: true
  schedule: "*/15 * * * *"       # every 15 minutes
  timeZone: "UTC"
  command: ["python", "scripts/reconcile_orphans.py"]
  concurrencyPolicy: Forbid
  restartPolicy: Never
  backoffLimit: 1
  activeDeadlineSeconds: 600      # a sweep is a couple SELECTs + a few UPDATEs

# Pod Identity: REUSE the mesh SA — its role (transmission-dev-mesh) already holds
# AssumeRole+TagSession+SetSourceIdentity into transmission-recall-dev-app (the RW
# role, verified live for the conversation-mirror write path), which is exactly
# the credential the finalize UPDATE needs. No new IAM, no new credential path —
# the sweep reuses the mirror's RW discipline.
serviceAccount:
  create: false
  name: mesh

# No autoscaler / no PDB / no ingress — a batch job has none of these.
hpa:
  enabled: false
ingress:
  enabled: false
# A CronJob has no listen port, so the default-deny *ingress* NetworkPolicy is
# moot; skip it (egress to Recall/STS is unrestricted, same as services).
networkPolicy:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# Config → ConfigMap. The job needs ONLY the RW Recall path (transmission_app,
# IAM) — reconcile makes NO model calls, so unlike learning-consolidation there
# is no LiteLLM gateway config here. The finalize UPDATE runs as transmission_app
# over the mirror's pool builder (mesh.mirror.db, RECALL_WRITE_ROLE).
# ─────────────────────────────────────────────────────────────────────────────
env:
  - name: ENVIRONMENT
    value: dev

  # Observability — same collector as the services.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://otel-collector.observability:4318
  - name: OTEL_SERVICE_NAME
    value: reconcile-orphans

  # Recall RW path. The finalize UPDATE runs as transmission_app over the mirror's
  # pool builder (mesh.mirror.db, RECALL_WRITE_ROLE). RECALL_USE_IAM=1 → the pool
  # mints an RDS IAM token per connection; transmission-recall-dev-app
  # `rds-db:connect`s ONLY as transmission_app (the strict role↔DB-user pairing).
  # No DB password / secret needed under IAM.
  - name: RECALL_USE_IAM
    value: "true"
  - name: RECALL_WRITE_ROLE
    value: transmission_app
  - name: RECALL_APP_ROLE_ARN
    value: arn:aws:iam::457497801237:role/transmission-recall-dev-app

# A sweep is very light (a SELECT + a handful of UPDATEs — no LLM, no embeddings).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
