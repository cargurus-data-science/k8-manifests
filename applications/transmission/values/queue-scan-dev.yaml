# queue-scan (#605 Q2) — the hourly Queue-readiness scoring sweep.
#
# A SCHEDULED BATCH job, not a service. Layered over chart/values.yaml by:
#
#   helm upgrade --install queue-scan chart/ \
#     --namespace transmission \
#     --values chart/values/queue-scan-dev.yaml \
#     --set image.tag=<sha> --wait --atomic
#
# Release name = service name = values stem = `queue-scan` — the convention
# deploy.yml's matrix follows (deploy-convention-release-name-trap). ★ This name
# MUST also be in deploy.yml's SERVICES array (the #317 miss: without it,
# `helm upgrade --install` never runs for the cron and the CronJob object is
# never created in-cluster).
#
# `cronjob.enabled: true` flips the chart to render a `batch/v1` CronJob and
# SUPPRESS the Deployment + Service (deployment.yaml / service.yaml gate on it).
# It runs the SAME mesh image (so `mesh.flow.queue_scan` + scripts/ are present)
# but as a one-shot batch container that runs the scan and exits.
#
# What it does: walks the maintenance backlog via the mesh-side Jira search
# port (`mesh.flow.jira_search`), computes each ticket's content hash, skips a
# cache hit (0 tokens), and scores a miss via `readiness_check`
# (`mesh.flow.readiness`) — UPSERTing into `memory.readiness_verdict` as
# `scored_by='sweep'`. The dashboard's `GET /api/queue` (Q3, a sibling PR) reads
# these stored verdicts instead of scoring on every page view — this cron is
# the token win's write side.
service:
  # Resource handle (CronJob/SA/ConfigMap name). NOT a listen port — a job has no
  # inbound traffic; `port` is unused here but the schema requires service.name.
  name: queue-scan

# Reuse the mesh image: it already carries the shared `mesh` library + scripts/
# (Dockerfile builds from repo root), so scripts/scan_queue.py resolves and
# `mesh.flow.queue_scan` imports. CI pins the real SHA via --set image.tag.
image:
  repository: 457497801237.dkr.ecr.us-east-1.amazonaws.com/transmission/mesh
  tag: 5e172d9b
  pullPolicy: IfNotPresent

# ─────────────────────────────────────────────────────────────────────────────
# The cron itself — HOURLY (ruling #605 §2a: ticket bodies change on human
# timescales, and cost is per-*change*, not per-tick — a tight schedule buys
# nothing once the content hash makes an unchanged ticket a free skip).
# concurrencyPolicy=Forbid is the SERIALIZE bound: one scan at a time, never two
# racing UPSERTs on the same ticket. restartPolicy=Never + backoffLimit=1:
# don't hammer in place; a failed pass becomes a Failed Job (alertable) and the
# next tick retries (no row is left half-written on failure).
# ─────────────────────────────────────────────────────────────────────────────
cronjob:
  enabled: true
  # LIVE as of 2026-08-04 (Manager's call, authorized by Raghu). Authored parked
  # (suspend=true) by the slice that built it — go-live was deliberately left to
  # the Manager, and this flip is that decision, in git rather than an
  # out-of-band kubectl patch so it stays auditable.
  #
  # Why it went live: queue-scan is what populates memory.readiness_verdict for
  # the Jira backlog. Parked, it ran exactly once (2026-07-29T12:00Z) and then
  # sat for six days, so #756's ticket-status card found no cached verdict for
  # most tickets and fell through to recomputing readiness live (2.4-8.3s and a
  # Haiku call per ask). A correctly-parked cron is indistinguishable from a
  # forgotten one; nothing ever prompted the go-live decision.
  #
  # Cost this turns on: hourly Jira reads plus one Haiku scoring call per
  # not-yet-scored ticket. Bounded by the backlog JQL, and the verdict is keyed
  # on (ticket_key, body_hash, rubric_version) so an unchanged body is a cache
  # hit, never a re-score.
  suspend: false
  schedule: "0 * * * *"          # hourly, on the hour
  timeZone: "UTC"
  command: ["python", "scripts/scan_queue.py"]
  concurrencyPolicy: Forbid
  restartPolicy: Never
  backoffLimit: 1
  activeDeadlineSeconds: 600      # a scan is a handful of REST pages + small UPSERTs

# Pod Identity: REUSE the mesh SA — its role (transmission-dev-mesh) already
# holds AssumeRole+TagSession+SetSourceIdentity into transmission-recall-dev-app
# (the RW role, verified live for the conversation-mirror write path), which is
# exactly the credential the readiness_verdict UPSERT needs. No new IAM, no new
# credential path — the scan reuses the mirror's RW discipline.
serviceAccount:
  create: false
  name: mesh

# No autoscaler / no PDB / no ingress — a batch job has none of these.
hpa:
  enabled: false
ingress:
  enabled: false
# A CronJob has no listen port, so the default-deny *ingress* NetworkPolicy is
# moot; skip it (egress to Recall/Jira/the LiteLLM gateway is unrestricted,
# same as the other crons).
networkPolicy:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# Config → ConfigMap. The job needs: the RW Recall path (transmission_app, IAM)
# for the readiness_verdict UPSERT, the Jira read config (ATLASSIAN_BASE_URL;
# JIRA_BASIC_CRED rides the Secret), AND the LiteLLM gateway — readiness_check
# calls make_model() (mesh/shared/model.py) for a cache-miss ticket. Without
# LITELLM_BASE_URL the scorer raises "Missing required env var(s)" and every
# miss fails → 0 scored, all errors (the #445 class of gap). Mirrors mesh-dev /
# review-sweep-dev.
# ─────────────────────────────────────────────────────────────────────────────
env:
  - name: ENVIRONMENT
    value: dev

  # Observability — same collector as the services.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://otel-collector.observability:4318
  - name: OTEL_SERVICE_NAME
    value: queue-scan

  # Model gateway — readiness_check's cheap-tier call (make_model → ChatOpenAI)
  # routes through the CG LiteLLM gateway. Base URL is plain; LITELLM_API_KEY is
  # in the mesh-secrets Secret (mounted via envFromSecret below). Same gateway
  # as mesh-dev / review-sweep-dev.
  - name: LITELLM_BASE_URL
    value: https://litellm.datasci.d-gurus.com

  # Jira read — mesh.flow.jira_search reuses the SAME Basic-auth base URL the
  # Jira comment writer (mesh/flow/jira.py) already resolves; no new credential
  # surface (ruling #605 §6b ground 1). JIRA_BASIC_CRED rides mesh-secrets.
  - name: ATLASSIAN_BASE_URL
    value: https://cargurus.atlassian.net

  # Recall RW path. The readiness_verdict UPSERT runs as transmission_app over
  # the mirror's pool builder (mesh.mirror.db, RECALL_WRITE_ROLE). RECALL_USE_IAM=1
  # → the pool mints an RDS IAM token per connection; transmission-recall-dev-app
  # `rds-db:connect`s ONLY as transmission_app (the strict role↔DB-user pairing).
  # No DB password / secret needed under IAM.
  - name: RECALL_USE_IAM
    value: "true"
  - name: RECALL_WRITE_ROLE
    value: transmission_app
  - name: RECALL_APP_ROLE_ARN
    value: arn:aws:iam::457497801237:role/transmission-recall-dev-app

# mesh-secrets carries: LITELLM_API_KEY (the gateway virtual key readiness_check
# needs) and JIRA_BASIC_CRED (base64(email:api_token) — the SAME static Basic
# credential the Jira comment writer resolves, BROKER_JIRA_COMMENTS off).
# ★ JIRA_BASIC_CRED is not yet provisioned into mesh-secrets as of this PR — the
# comment-writer path (PL-3a) has never gone live, so this is a NEW key for that
# Secret. Provisioning it is a deploy-time step, not this PR's (CLAUDE.md: this
# slice authors the values file; it does not deploy or provision secrets).
envFromSecret: mesh-secrets

# A scan is light (a page of REST reads + a handful of cheap-tier LLM calls on
# cache misses + a handful of UPSERTs — no sandbox, no embeddings).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
