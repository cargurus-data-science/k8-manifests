# Edge Workbench frontend — dev environment values.
#
# Layered over chart/values.yaml by:
#   helm upgrade --install edge-frontend chart/ \
#     --values chart/values/edge-frontend-dev.yaml
#
# nginx serving a static Vite bundle (the Workbench platter on the MockAgent).
#
# DEPLOY CONVENTION (deploy.yml header): the Helm release name == service.name
# == this file's stem == `edge-frontend`. This file is scaffolded but NOT yet
# wired into the deploy.yml services matrix — that is a later Edge PR (PR-3:
# frontend->backend wiring). Until then this service does not deploy.
service:
  name: edge-frontend
  port: 80

image:
  repository: 457497801237.dkr.ecr.us-east-1.amazonaws.com/transmission/edge-frontend
  tag: cbbd2429
  pullPolicy: IfNotPresent

# Static assets: one replica, no autoscaling. With hpa disabled the Deployment is
# pinned to replicas.min, and the PDB auto-skips (a 1-pod PDB blocks node drains).
replicas:
  min: 1
  max: 1
hpa:
  enabled: false

serviceAccount:
  # No AWS calls from nginx, but Pod Identity still wants a named SA per pod.
  create: true
  name: edge-fe

# PR-3 deploy wiring: the frontend shares the Edge ALB group `transmission-edge`
# with the backend (same hostname). Catch-all "/" is matched AFTER the backend's
# /agent (higher groupOrder = lower precedence). external-dns also needs an owner
# for the shared A-record, so the FE carries an Ingress in the SAME group.
# Mirrors chart/values/dashboard-frontend-dev.yaml. NO certificateArn here — it
# MUST stay byte-identical to the backend's across a shared ALB group, and the
# backend omits it (HTTP-only until an edge-hostname ACM cert lands; see the
# backend values' ingress comment for the prerequisite).
ingress:
  enabled: true
  hostname: edge.datasci.d-gurus.com
  path: /
  groupName: transmission-edge
  groupOrder: 20
  # healthcheckPath defaults to path ("/"), which nginx serves 200 — correct here.

# Probes hit nginx on :80 at "/" (index.html). There is no /api on this static
# server in PR-1.
probes:
  liveness:
    path: /
  readiness:
    path: /
  startup:
    path: /

# Build-time only — baked into the static bundle by the Dockerfile's build ARGs
# (services/edge/frontend/Dockerfile: ARG VITE_USE_MOCK, ARG VITE_AGUI_URL). NOT
# runtime env vars and NOT consumed by the chart; the image-build/push path (a
# PREREQUISITE — no build workflow exists in this repo yet) passes them to
# `docker build`. Kept here as the single source of truth for what the image was
# built against.
#
# PR-3 flips off the MockAgent and points the real agent at the backend on the
# SAME origin. agent.ts passes VITE_AGUI_URL straight to HttpAgent({ url }), and
# HttpAgent calls fetch(url, ...) with no `new URL(...)` wrapping (verified
# against @ag-ui/client@0.0.54 — zero `new URL` in the bundle), so a relative
# "/agent" resolves against the page origin. At runtime the browser hits
# https://edge.datasci.d-gurus.com/agent, the ALB routes /agent -> edge-backend
# (groupOrder 10) — same-origin, NO CORS preflight (the simpler path; no
# absolute-URL + EDGE_CORS_ORIGINS fallback needed).
buildArgs:
  VITE_USE_MOCK: "false"
  VITE_AGUI_URL: "/agent"

# Stock nginx:1 runs its master as root. The chart default drops ALL Linux caps,
# which CrashLoops nginx at startup. Keep least-privilege (drop ALL) but add back
# exactly the caps the root master needs to boot:
#   NET_BIND_SERVICE — bind the privileged :80 listen socket
#   CHOWN            — chown /var/cache/nginx/*_temp to the worker user (101)
#   SETUID, SETGID   — fork workers and drop them to that unprivileged user
# (Matches dashboard-frontend-dev.yaml, where an earlier NET_BIND_SERVICE-only
# version CrashLooped on chown. This is the minimal complete set.)
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

networkPolicy:
  enabled: true
  allowFromNamespaces:
    - transmission
    - kube-system
  allowFromCIDRs: []
