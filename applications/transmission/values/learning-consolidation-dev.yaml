# LearningConsolidationJob (M1.5, DS-2875) — the 6h dedupe/supersede CronJob.
#
# A SCHEDULED BATCH job, not a service. Layered over chart/values.yaml by:
#
#   helm upgrade --install learning-consolidation chart/ \
#     --namespace transmission \
#     --values chart/values/learning-consolidation-dev.yaml \
#     --set image.tag=<sha> --wait --atomic
#
# Release name = service name = values stem = `learning-consolidation` — the
# convention deploy.yml's matrix follows (deploy-convention-release-name-trap).
#
# `cronjob.enabled: true` flips the chart to render a `batch/v1` CronJob and
# SUPPRESS the Deployment + Service (deployment.yaml / service.yaml gate on it).
# It runs the SAME mesh image (so `mesh.flow.consolidate` + scripts/ are present)
# but as a one-shot batch container that runs the pass and exits.
service:
  # Resource handle (CronJob/SA/ConfigMap name). NOT a listen port — a job has no
  # inbound traffic; `port` is unused here but the schema requires service.name.
  name: learning-consolidation

# Reuse the mesh image: it already carries the shared `mesh` library + scripts/
# (Dockerfile builds from repo root), so scripts/consolidate_learnings.py resolves
# and `mesh.flow.consolidate` imports. CI pins the real SHA via --set image.tag.
image:
  repository: 457497801237.dkr.ecr.us-east-1.amazonaws.com/transmission/mesh
  tag: 5e172d9b
  pullPolicy: IfNotPresent

# ─────────────────────────────────────────────────────────────────────────────
# The cron itself — 6h cadence (M1.5). Forbid overlap; a failed pass becomes a
# Failed Job (alertable) and the next tick retries (the corpus is untouched on
# failure). restartPolicy=Never + backoffLimit=1: don't hammer in place.
# ─────────────────────────────────────────────────────────────────────────────
cronjob:
  enabled: true
  schedule: "0 */6 * * *"        # every 6 hours
  timeZone: "UTC"
  command: ["python", "scripts/consolidate_learnings.py"]
  concurrencyPolicy: Forbid
  restartPolicy: Never
  backoffLimit: 1
  activeDeadlineSeconds: 1800

# Pod Identity: REUSE the mesh SA — its role (transmission-dev-mesh) already holds
# AssumeRole+TagSession+SetSourceIdentity into transmission-recall-dev-app (the RW
# role, verified live for the conversation-mirror write path), which is exactly
# the credential the supersede UPDATE needs. No new IAM, no new credential path —
# the consolidation write reuses the M1 promote valve's RW discipline.
serviceAccount:
  create: false
  name: mesh

# No autoscaler / no PDB / no ingress — a batch job has none of these.
hpa:
  enabled: false
ingress:
  enabled: false
# A CronJob has no listen port, so the default-deny *ingress* NetworkPolicy is
# moot; skip it (egress to Recall/Bedrock/STS is unrestricted, same as services).
networkPolicy:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# Config → ConfigMap. The job needs: the RW Recall path (transmission_app, IAM)
# and the LiteLLM gateway (the Sonnet-tier contradiction check). Mirrors mesh-dev
# but as the WRITE role — the supersede UPDATE runs as transmission_app.
# ─────────────────────────────────────────────────────────────────────────────
env:
  - name: ENVIRONMENT
    value: dev

  # Observability — same collector as the services.
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://otel-collector.observability:4318
  - name: OTEL_SERVICE_NAME
    value: learning-consolidation

  # Model gateway — the contradiction check is Sonnet-tier (cheap, batch).
  # LITELLM_API_KEY is in the Secret.
  - name: LITELLM_BASE_URL
    value: https://litellm.datasci.d-gurus.com
  - name: LLM_MODEL_ID
    value: claude-sonnet-4-6

  # Recall RW path. The supersede + flag UPDATEs run as transmission_app over the
  # mirror's pool builder (mesh.mirror.db, RECALL_WRITE_ROLE). RECALL_USE_IAM=1 →
  # the pool mints an RDS IAM token per connection; transmission-recall-dev-app
  # `rds-db:connect`s ONLY as transmission_app (the strict role↔DB-user pairing).
  # No DB password / secret needed under IAM.
  - name: RECALL_USE_IAM
    value: "true"
  - name: RECALL_WRITE_ROLE
    value: transmission_app
  - name: RECALL_APP_ROLE_ARN
    value: arn:aws:iam::457497801237:role/transmission-recall-dev-app

# LITELLM_API_KEY (the gateway virtual key) lives in the mesh-secrets Secret —
# the same Secret the mesh service uses; reused here for the gateway call.
envFromSecret: mesh-secrets

# A batch pass is light (a few SELECTs + a handful of UPDATEs + cheap LLM calls).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
