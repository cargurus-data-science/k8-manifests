# The RW component pods obtain AWS creds via a Terraform-managed Pod Identity
# association bound to this SA (IRSA is Sentinel-blocked in this org). No
# annotations are needed: Pod Identity binds by (cluster, namespace, sa name),
# not by an eks.amazonaws.com/role-arn annotation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risingwave-s3
  namespace: risingwave
  labels:
    team: data-science
