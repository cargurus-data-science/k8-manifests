suite: backend deployment
templates:
  - templates/backend/deployment.yaml
release:
  namespace: turbo
tests:
  - it: is a single-replica Deployment named turbo-app
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: turbo-app
      - equal:
          path: spec.replicas
          value: 1
  - it: never evicts the sole pod during rollout (maxUnavailable 0)
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1
  - it: runs as the turbo-app ServiceAccount
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: turbo-app
  - it: exposes container port 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
  - it: pulls env from the configmap and all three secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: turbo-app-config
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: turbo-core
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: turbo-external-tools
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: turbo-arango
  - it: maps the two OMNI aliases via secretKeyRef
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OMNI_BASE_URL
            valueFrom:
              secretKeyRef:
                name: turbo-external-tools
                key: OMNI_HOST
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OMNI_API_KEY
            valueFrom:
              secretKeyRef:
                name: turbo-external-tools
                key: OMNI_API_TOKEN
  - it: probes /healthz on all three probes (single-replica must not flap)
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
  - it: runs non-root with an explicit numeric UID
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
  - it: gives poller shutdown enough grace (120s) and a preStop pause
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
