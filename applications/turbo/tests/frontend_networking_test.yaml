suite: frontend service + targetgroupbinding
templates:
  - templates/frontend/service.yaml
  - templates/frontend/targetgroupbinding.yaml
release:
  namespace: turbo
tests:
  - it: exposes a ClusterIP Service named turbo-frontend on 80
    template: templates/frontend/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: turbo-frontend
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: frontend
  - it: binds pods to the frontend target group (target-type ip)
    template: templates/frontend/targetgroupbinding.yaml
    set:
      frontend.targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:457497801237:targetgroup/turbo-frontend/def
    asserts:
      - isKind:
          of: TargetGroupBinding
      - equal:
          path: spec.targetType
          value: ip
      - equal:
          path: spec.serviceRef.name
          value: turbo-frontend
      - equal:
          path: spec.serviceRef.port
          value: 80
      - equal:
          path: spec.targetGroupARN
          value: arn:aws:elasticloadbalancing:us-east-1:457497801237:targetgroup/turbo-frontend/def
