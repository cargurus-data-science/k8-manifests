suite: backend service + targetgroupbinding
templates:
  - templates/backend/service.yaml
  - templates/backend/targetgroupbinding.yaml
release:
  namespace: turbo
tests:
  - it: exposes a ClusterIP Service named turbo-app on 8080
    template: templates/backend/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: turbo-app
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: backend
  - it: binds pods (target-type ip) to the backend target group
    template: templates/backend/targetgroupbinding.yaml
    set:
      backend.targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:457497801237:targetgroup/turbo-app/abc
    asserts:
      - isKind:
          of: TargetGroupBinding
      - equal:
          path: apiVersion
          value: elbv2.k8s.aws/v1beta1
      - equal:
          path: spec.targetType
          value: ip
      - equal:
          path: spec.serviceRef.name
          value: turbo-app
      - equal:
          path: spec.serviceRef.port
          value: 8080
      - equal:
          path: spec.targetGroupARN
          value: arn:aws:elasticloadbalancing:us-east-1:457497801237:targetgroup/turbo-app/abc
