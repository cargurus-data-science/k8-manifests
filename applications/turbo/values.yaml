# Shared defaults. Per-environment values live in values-{dev,prod}.yaml.
# REPLACE_ME_* markers are filled from Terraform outputs at install time.

secrets:
  coreName: turbo-core
  externalToolsName: turbo-external-tools
  arangoName: turbo-arango

# External Secrets Operator (opt-in; default off). When enabled, ESO syncs the
# AWS Secrets Manager bundles into the three Secrets above, so they no longer
# need out-of-band creation. The ESO *operator* is a cluster-wide platform addon
# (NOT in this chart) — these are just the tenant CRs. Auth is the ESO
# controller's own role (scoped to turbo/* on the addon side); no per-tenant
# role is wired here. refreshInterval is omitted → ESO's 1h default (harmless;
# pods only pick up changes on restart, which is Reloader's job, not wired yet).
externalSecrets:
  enabled: false
  region: us-east-1
  secretStoreName: turbo-aws
  remoteKeys:
    core: turbo/core                      # same bundle name in both envs (distinct accounts)
    externalTools: turbo/external-tools
    arango: turbo/arango

backend:
  replicas: 1                              # PINNED — do not raise (spec §5)
  image:
    repository: REPLACE_ME_BACKEND_ECR_REPO   # modules/ecr (prod: turbo, dev: turbo-dev)
    tag: REPLACE_ME_IMAGE_SHA                 # immutable SHA per deploy
    pullPolicy: IfNotPresent
  targetGroupArn: REPLACE_ME_BACKEND_TG_ARN   # modules/alb output
  serviceAccountName: turbo
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 20Gi               # repo clones + caches (spec §9.3, tunable)
    limits:
      memory: 4Gi
      ephemeral-storage: 40Gi
  # Non-secret env → ConfigMap turbo-app-config. Env-specific values are
  # overridden/added in values-{env}.yaml.
  config:
    OAUTH_GHEC_ENABLED: "true"
    OKTA_ISSUER: "https://cargurus.okta.com/oauth2/default"
    TURBO_ASSISTANTS_DIR: "/app/assistants"
    GHES_API_BASE_URL: "https://code.cargurus.com/api/v3"
    GITHUB_REQUIRED_ORG: "cargurus-analytics"
    GITHUB_ADMIN_LOGINS: '["rmankad","jhmorgan-cg"]'
    OKTA_ADMIN_EMAILS: '["rmankad@cargurus.com","jhmorgan@cargurus.com"]'
    DBT_CLOUD_IP_ALLOWLIST: "52.3.77.232,3.214.191.130,34.233.79.135"
    HARNESS_PREWARM_REPOS: '["https://github.com/cargurus-analytics/dbt-central","https://github.com/cargurus-analytics/dbt-secure","https://github.com/cargurus-analytics/dbt-mrr","https://github.com/cargurus-analytics/dbt-fivetran-transformations","https://github.com/cargurus-analytics/dbt-iceberg","https://github.com/cargurus-analytics/cg-omni-curated","https://github.com/cargurus-analytics/cg-omni-restricted","https://github.com/cargurus-analytics/turbo","https://code.cargurus.com/analytics/migrator_analytics","https://code.cargurus.com/analytics/analytics-semantic-layer","https://github.com/cargurus-analytics/dbt-iceberg"]'
    ARANGO_DATABASE: "turbo"
    ARANGO_URL: ""                          # empty → backend skips ArangoDB gracefully
    MEDIA_S3_BUCKET: REPLACE_ME_MEDIA_BUCKET  # modules/s3 output

# Runtime env for the workflow-runner Job (ConfigMap turbo-workflow-runner-config),
# read by the `turbo workflow run` CLI the backend launches via EKSDispatchService.
# The EKS analog of the ECS runner task-def's `environment` block
# (terraform/workflow_runner.tf), minus vars the runner never reads (no HTTP, no
# OAuth, no repo prewarm). Secret bundles + the two OMNI aliases reach the Job via
# envFrom, wired imperatively in EKSDispatchService — not here. Env-specific values
# (ENVIRONMENT, URLs, PROMPT_LABEL, REDIS DB) live in values-{env}.yaml.
workflowRunner:
  config:
    AI_MODEL: "turbo-sonnet"
    EMBEDDING_MODEL: "turbo-embed"
    EMBEDDING_DIM: "1024"
    GITHUB_REQUIRED_ORG: "cargurus-analytics"
    GITHUB_ADMIN_LOGINS: '["rmankad","jhmorgan-cg"]'
    OKTA_ADMIN_EMAILS: '["rmankad@cargurus.com","jhmorgan@cargurus.com"]'
    GHES_API_BASE_URL: "https://code.cargurus.com/api/v3"
    MEDIA_S3_BUCKET: REPLACE_ME_MEDIA_BUCKET  # modules/s3 output (same bucket as backend)
    ARANGO_DATABASE: "turbo"                  # inert unless ARANGO_URL is set
    ARANGO_URL: ""                            # KG workflows only; empty → skipped

frontend:
  replicas: 1
  image:
    repository: REPLACE_ME_FRONTEND_ECR_REPO  # prod: turbo-frontend, dev: turbo-frontend-dev
    tag: REPLACE_ME_IMAGE_SHA
    pullPolicy: IfNotPresent
  targetGroupArn: REPLACE_ME_FRONTEND_TG_ARN
  serviceAccountName: turbo-frontend
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi
  config: {}                                # BACKEND_URL is templated (in-cluster DNS)
