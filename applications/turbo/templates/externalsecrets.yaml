{{- /*
External Secrets Operator resources (opt-in via .Values.externalSecrets.enabled,
default off). When enabled, ESO syncs the AWS Secrets Manager bundles into the
three K8s Secrets the backend consumes (envFrom.secretRef), replacing the
out-of-band creation described in README "Prerequisites".

The ESO *operator* is a cluster-wide platform addon, NOT part of this chart.
Auth is the ESO controller's own IAM role (its Pod Identity) — no per-tenant
role is wired here; the controller role is scoped to turbo/* on the addon side.
refreshInterval is intentionally omitted (ESO defaults to 1h).
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $es.secretStoreName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turbo.labels" . | nindent 4 }}
    app.kubernetes.io/name: turbo
    app.kubernetes.io/component: secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $es.region }}
{{- $secrets := .Values.secrets }}
{{- $items := list
    (dict "target" $secrets.coreName "key" $es.remoteKeys.core)
    (dict "target" $secrets.externalToolsName "key" $es.remoteKeys.externalTools)
    (dict "target" $secrets.arangoName "key" $es.remoteKeys.arango) }}
{{- range $item := $items }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $item.target }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "turbo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: turbo
    app.kubernetes.io/component: secrets
spec:
  secretStoreRef:
    name: {{ $es.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ $item.target }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $item.key }}
{{- end }}
{{- end }}
