apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: turbo-workflow-dispatch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turbo.labels" . | nindent 4 }}
    {{- include "turbo.backend.selectorLabels" . | nindent 4 }}
rules:
  # EKSDispatchService.create_namespaced_job is the ONLY K8s API call the backend
  # makes. Pods are created by the Job controller (not this SA); finished Jobs are
  # GC'd by ttlSecondsAfterFinished. So `create` on batch/jobs is the whole need —
  # no get/list/watch/delete, no pods/log.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: turbo-workflow-dispatch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turbo.labels" . | nindent 4 }}
    {{- include "turbo.backend.selectorLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.backend.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: turbo-workflow-dispatch
