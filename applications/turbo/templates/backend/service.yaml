apiVersion: v1
kind: Service
metadata:
  name: turbo-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turbo.labels" . | nindent 4 }}
    {{- include "turbo.backend.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "turbo.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
