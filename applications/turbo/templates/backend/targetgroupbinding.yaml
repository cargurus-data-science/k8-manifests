apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: turbo-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turbo.labels" . | nindent 4 }}
    {{- include "turbo.backend.selectorLabels" . | nindent 4 }}
spec:
  # target_type=ip: the LB Controller registers pod IPs directly into the
  # Terraform-owned target group (spec §4.4 of the infra design).
  targetType: ip
  serviceRef:
    name: turbo-app
    port: 8080
  targetGroupARN: {{ .Values.backend.targetGroupArn }}
