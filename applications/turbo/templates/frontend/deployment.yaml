apiVersion: apps/v1
kind: Deployment
metadata:
  name: turbo-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turbo.labels" . | nindent 4 }}
    {{- include "turbo.frontend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "turbo.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "turbo.labels" . | nindent 8 }}
        {{- include "turbo.frontend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.frontend.serviceAccountName }}
      # 'nextjs' is UID 1001 — set explicitly in frontend/Dockerfile:37
      # (adduser --uid 1001). kubelet cannot enforce runAsNonRoot from a
      # username, so pin the numeric UID; it must match the image's baked-in
      # user or the chown'd .next assets become unreadable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: "{{ required "frontend.image.repository must be set in values-<env>.yaml" .Values.frontend.image.repository }}:{{ required "frontend.image.tag must be set (values-<env>.yaml or --set at deploy)" .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: turbo-frontend-config
          # Next.js standalone server has no /healthz route; the app root is
          # the liveness/readiness signal (ALB frontend TG checks / → 200-399).
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              # drop:[ALL] removes NET_BIND_SERVICE; port 80 (<1024) needs it
              # back. On Fargate the default cap set allowed the bind; K8s
              # requires the explicit add. See spec §4 / securityContext notes.
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
